<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPERAÇÃO AGV — Versão Acessível</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --primary: #2c5f8a;
        --primary-d: #1f4568;
        --accent: #d97742;
        --accent-d: #b55e2e;
        --bg: #fafafa;
        --bg-alt: #f0f2f4;
        --success: #4a8b3a;
        --alert: #a83232;
        --text: #2a2e32;
        --muted: #5a6b77;
        --border: #d5dce1;
        --radius: 14px;
        --shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        --soft-yellow: #fff9e6;
        --soft-blue: #eaf3f9;
        --soft-green: #edf6e9;
        --soft-red: #fbe9e9;
        --font-base: 18px;
      }
      body {
        font-family: "Segoe UI", Verdana, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: var(--font-base);
        line-height: 1.8;
        letter-spacing: 0.01em;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        font-size: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3,
      h4 {
        line-height: 1.4;
        color: var(--primary-d);
        margin-bottom: 0.6rem;
      }
      h2 {
        font-size: 1.6rem;
      }
      h3 {
        font-size: 1.3rem;
        margin-top: 1.4rem;
      }
      p {
        margin-bottom: 0.9rem;
        max-width: 62ch;
      }
      ul,
      ol {
        margin: 0.6rem 0 1rem 1.6rem;
      }
      li {
        margin-bottom: 0.5rem;
      }
      :focus-visible {
        outline: 4px solid var(--accent);
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* SELO DE ETAPA (rotina previsível) */
      .step-ribbon {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-bottom: 1.2rem;
        padding: 0.7rem;
        background: var(--soft-blue);
        border-radius: 10px;
        justify-content: center;
      }
      .step-ribbon .step {
        padding: 0.35rem 0.8rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
        background: #fff;
        border: 2px solid var(--border);
      }
      .step-ribbon .step.done {
        background: var(--soft-green);
        border-color: var(--success);
        color: var(--success);
      }
      .step-ribbon .step.current {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent-d);
      }

      /* HEADER */
      .topbar {
        background: var(--primary);
        color: #fff;
        padding: 0.9rem 1.2rem;
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        z-index: 50;
        box-shadow: var(--shadow);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        font-weight: 700;
        font-size: 1.1rem;
      }
      .brand .logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--accent);
        display: grid;
        place-items: center;
        font-size: 1.3rem;
      }
      .brand small {
        display: block;
        font-weight: 400;
        font-size: 0.78rem;
        opacity: 0.85;
      }
      .nav {
        display: flex;
        gap: 0.3rem;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .nav button {
        color: #fff;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        font-size: 0.95rem;
        border: 2px solid transparent;
        min-height: 48px;
      }
      .nav button:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .nav button.active {
        background: var(--accent);
        border-color: var(--accent-d);
      }

      .main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 1.5rem 1rem 4rem;
      }
      .card {
        background: #fff;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.5rem 1.8rem;
        margin-bottom: 1.2rem;
        border: 2px solid var(--border);
      }
      .card-soft {
        background: var(--soft-blue);
        border: 2px solid var(--primary);
        border-radius: var(--radius);
        padding: 1.4rem 1.6rem;
        margin-bottom: 1.2rem;
      }
      .card-warn {
        background: var(--soft-red);
        border: 2px solid var(--alert);
        border-radius: var(--radius);
        padding: 1.4rem 1.6rem;
        margin-bottom: 1.2rem;
      }
      .card-ok {
        background: var(--soft-green);
        border: 2px solid var(--success);
        border-radius: var(--radius);
        padding: 1.4rem 1.6rem;
        margin-bottom: 1.2rem;
      }
      .card-yellow {
        background: var(--soft-yellow);
        border: 2px solid var(--accent);
        border-radius: var(--radius);
        padding: 1.4rem 1.6rem;
        margin-bottom: 1.2rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.85rem 1.5rem;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        min-height: 52px;
        transition: background 0.15s;
        border: 2px solid var(--primary-d);
      }
      .btn:hover {
        background: var(--primary-d);
      }
      .btn.acc {
        background: var(--accent);
        border-color: var(--accent-d);
      }
      .btn.acc:hover {
        background: var(--accent-d);
      }
      .btn.ghost {
        background: #fff;
        color: var(--primary);
        border: 2px solid var(--primary);
      }
      .btn.ghost:hover {
        background: var(--soft-blue);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.sm {
        padding: 0.6rem 1rem;
        min-height: 44px;
        font-size: 0.92rem;
      }

      /* DASHBOARD */
      .hero {
        background: linear-gradient(135deg, var(--primary), #3e7aa8);
        color: #fff;
        border-radius: var(--radius);
        padding: 1.8rem 1.6rem;
        margin-bottom: 1.4rem;
        text-align: center;
      }
      .hero h2 {
        color: #fff;
        font-size: 1.5rem;
        margin-bottom: 0.3rem;
      }
      .hero p {
        color: rgba(255, 255, 255, 0.95);
        margin-bottom: 0.4rem;
        max-width: none;
      }
      .name-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        margin: 0.9rem 0;
      }
      .name-box label {
        font-size: 0.92rem;
        opacity: 0.9;
      }
      .name-box input {
        padding: 0.7rem 1rem;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 1.05rem;
        width: 100%;
        max-width: 340px;
        min-height: 48px;
      }
      .name-box input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }
      .xpbar {
        height: 16px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        overflow: hidden;
        margin: 0.8rem auto 0;
        max-width: 400px;
      }
      .xpbar > div {
        height: 100%;
        background: var(--accent);
        transition: width 0.6s;
      }

      .grid-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.9rem;
        margin-bottom: 1.2rem;
      }
      .stat {
        background: #fff;
        border-radius: 12px;
        padding: 1.1rem;
        border: 2px solid var(--border);
        text-align: center;
      }
      .stat .num {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--primary);
      }
      .stat .lbl {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 0.2rem;
      }

      .grid-mod {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .mod-card {
        background: #fff;
        border: 3px solid var(--border);
        border-radius: 14px;
        padding: 1.3rem 1.4rem;
        text-align: left;
        display: flex;
        gap: 1rem;
        align-items: center;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
        min-height: 100px;
        cursor: pointer;
      }
      .mod-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        border-color: var(--accent);
      }
      .mod-card.done {
        border-color: var(--success);
        background: var(--soft-green);
      }
      .mod-card.available {
        border-color: var(--accent);
        background: var(--soft-yellow);
      }
      .mod-card.locked {
        opacity: 0.55;
        cursor: not-allowed;
        background: #f5f5f5;
      }
      .mod-card .mod-icon {
        font-size: 2.5rem;
        flex-shrink: 0;
        width: 70px;
        text-align: center;
      }
      .mod-card .mod-info {
        flex: 1;
      }
      .mod-card h4 {
        font-size: 1.1rem;
        margin: 0 0 0.2rem;
        color: var(--primary-d);
      }
      .mod-card .mod-sub {
        font-size: 0.88rem;
        color: var(--muted);
        margin: 0;
      }
      .mod-card .mod-badge {
        font-size: 0.78rem;
        font-weight: 700;
        padding: 0.25rem 0.7rem;
        border-radius: 20px;
        background: var(--primary);
        color: #fff;
        margin-top: 0.4rem;
        display: inline-block;
      }
      .mod-card.done .mod-badge {
        background: var(--success);
      }
      .mod-card.available .mod-badge {
        background: var(--accent);
      }

      /* CONTEÚDO DO MÓDULO */
      .lesson {
        background: #fff;
        border-radius: var(--radius);
        border: 2px solid var(--border);
        padding: 1.8rem 2rem;
        margin-bottom: 1.2rem;
      }
      .module-tag {
        display: inline-block;
        background: var(--primary);
        color: #fff;
        font-size: 0.8rem;
        padding: 0.35rem 0.9rem;
        border-radius: 20px;
        font-weight: 700;
        letter-spacing: 0.4px;
        margin-bottom: 1rem;
      }

      .block-title {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 1.25rem;
        color: var(--primary-d);
        font-weight: 800;
        margin: 1.5rem 0 0.7rem;
        padding-bottom: 0.4rem;
        border-bottom: 3px solid var(--soft-blue);
      }
      .block-title .ico {
        font-size: 1.6rem;
      }

      .interest-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.9rem;
        margin: 1.2rem 0;
      }
      @media (min-width: 640px) {
        .interest-grid {
          grid-template-columns: 1fr 1fr 1fr;
        }
      }
      .interest-card {
        border-radius: 12px;
        padding: 1.1rem 1.2rem;
        border: 2px solid;
        text-align: left;
      }
      .interest-card.soccer {
        background: var(--soft-green);
        border-color: var(--success);
      }
      .interest-card.plane {
        background: var(--soft-blue);
        border-color: var(--primary);
      }
      .interest-card.order {
        background: var(--soft-yellow);
        border-color: var(--accent);
      }
      .interest-card .interest-head {
        font-size: 1.4rem;
        margin-bottom: 0.4rem;
        display: block;
      }
      .interest-card .interest-title {
        font-weight: 800;
        font-size: 0.95rem;
        margin-bottom: 0.3rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.9;
      }
      .interest-card p {
        font-size: 0.95rem;
        margin: 0;
        line-height: 1.6;
      }

      .img-frame {
        background: #fff;
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 1.1rem;
        margin: 1.2rem 0;
        text-align: center;
      }
      .img-frame svg {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto;
      }
      .img-caption {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 0.7rem;
        font-style: italic;
        text-align: left;
        padding: 0 0.5rem;
      }

      /* ÁREA INTERATIVA */
      .ia {
        background: var(--soft-blue);
        border: 2px solid var(--primary);
        border-radius: 12px;
        padding: 1.3rem 1.4rem;
        margin: 1.2rem 0;
      }
      .ia .ia-title {
        font-weight: 800;
        color: var(--primary-d);
        font-size: 1.05rem;
        margin-bottom: 0.8rem;
      }
      .ia label {
        display: block;
        font-size: 0.92rem;
        color: var(--primary-d);
        font-weight: 600;
        margin: 0.7rem 0 0.3rem;
      }
      .ia input[type="range"] {
        width: 100%;
        height: 32px;
        accent-color: var(--accent);
      }
      .ia .val {
        font-family: ui-monospace, Consolas, monospace;
        color: var(--accent-d);
        font-weight: 800;
        font-size: 1.05rem;
      }
      .row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 1;
        min-width: 200px;
      }
      canvas {
        max-width: 100%;
        display: block;
        border-radius: 10px;
        background: #1a2530;
        border: 2px solid var(--border);
        margin: 0.6rem 0;
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 0.7rem 0.9rem;
        border: 2px solid var(--border);
        border-radius: 10px;
        font-family: inherit;
        font-size: 1rem;
        background: #fff;
        min-height: 48px;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--primary);
      }
      .field textarea {
        min-height: 90px;
        resize: vertical;
      }
      .field label {
        display: block;
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 0.4rem;
        color: var(--primary-d);
      }

      /* QUIZ */
      .quiz-q {
        background: #fff;
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 1.3rem 1.4rem;
        margin-bottom: 1.1rem;
      }
      .quiz-q .qtext {
        font-weight: 700;
        margin-bottom: 1rem;
        font-size: 1.05rem;
        display: block;
      }
      .quiz-opt {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.9rem 1.1rem;
        border: 2px solid var(--border);
        border-radius: 10px;
        margin-bottom: 0.6rem;
        background: #fff;
        transition: all 0.15s;
        min-height: 56px;
        font-size: 1rem;
        line-height: 1.4;
      }
      .quiz-opt:hover:not([disabled]) {
        border-color: var(--primary);
        background: var(--soft-blue);
      }
      .quiz-opt.correct {
        border-color: var(--success);
        background: var(--soft-green);
        font-weight: 700;
      }
      .quiz-opt.wrong {
        border-color: var(--alert);
        background: var(--soft-red);
      }
      .quiz-opt[disabled] {
        cursor: default;
        opacity: 0.75;
      }
      .fb {
        margin-top: 0.7rem;
        padding: 0.9rem 1.1rem;
        border-radius: 10px;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .fb.ok {
        background: var(--soft-green);
        color: #2d5a1f;
        border-left: 5px solid var(--success);
      }
      .fb.no {
        background: var(--soft-red);
        color: #7a1a1a;
        border-left: 5px solid var(--alert);
      }
      .fb[hidden] {
        display: none;
      }

      /* REQUISITOS */
      .req-list {
        background: var(--soft-yellow);
        border: 2px dashed var(--accent);
        border-radius: 12px;
        padding: 1rem 1.2rem;
        margin: 1.2rem 0;
      }
      .req-list .req-title {
        font-weight: 800;
        color: var(--primary-d);
        font-size: 1rem;
        margin-bottom: 0.6rem;
      }
      .req-item {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.5rem 0;
        font-size: 0.98rem;
      }
      .req-item .req-ic {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        background: #d5dce1;
        color: #fff;
        font-size: 0.85rem;
        flex-shrink: 0;
      }
      .req-item.ok {
        color: var(--success);
        font-weight: 700;
      }
      .req-item.ok .req-ic {
        background: var(--success);
      }

      /* NAVEGAÇÃO */
      .tp-nav {
        display: flex;
        justify-content: space-between;
        gap: 0.8rem;
        margin-top: 1.8rem;
        flex-wrap: wrap;
      }
      .hint-box {
        background: var(--soft-yellow);
        border-left: 5px solid var(--accent);
        padding: 0.9rem 1.1rem;
        border-radius: 8px;
        margin: 0.8rem 0;
        font-size: 0.95rem;
      }
      .hint-box summary {
        cursor: pointer;
        font-weight: 700;
        color: var(--accent-d);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 2rem 1rem;
        font-style: italic;
      }
      .done-chk {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        font-size: 1rem;
        padding: 0.7rem 0;
        cursor: pointer;
        line-height: 1.4;
      }
      .done-chk input {
        width: 26px;
        height: 26px;
        accent-color: var(--success);
        flex-shrink: 0;
      }

      /* DATASHEET VIEWER */
      .ds-viewer {
        border: 2px solid var(--border);
        border-radius: 12px;
        margin: 1.2rem 0;
        overflow: hidden;
      }
      .ds-tabs {
        display: flex;
        background: var(--soft-blue);
        border-bottom: 2px solid var(--border);
        flex-wrap: wrap;
      }
      .ds-tabs button {
        flex: 1;
        padding: 0.9rem 1rem;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--primary);
        border-bottom: 4px solid transparent;
        min-width: 130px;
        min-height: 52px;
      }
      .ds-tabs button.active {
        border-bottom-color: var(--accent);
        background: #fff;
        color: var(--accent-d);
      }
      .ds-body {
        padding: 1.3rem;
        background: #fff;
        font-size: 0.98rem;
        line-height: 1.7;
      }

      /* MEDIÇÕES */
      .table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.8rem 0;
        font-size: 0.92rem;
      }
      .table th,
      .table td {
        border: 2px solid var(--border);
        padding: 0.7rem 0.8rem;
        text-align: left;
      }
      .table th {
        background: var(--soft-blue);
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        color: var(--primary-d);
      }

      /* FORM */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      @media (min-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }
        .form-grid .full {
          grid-column: 1/-1;
        }
      }

      /* TOAST */
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary);
        color: #fff;
        padding: 1rem 1.6rem;
        border-radius: 30px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        z-index: 999;
        font-weight: 700;
        font-size: 1rem;
        animation: toastIn 0.3s ease-out;
        max-width: 90vw;
        text-align: center;
      }

      .save-indicator {
        position: fixed;
        bottom: 90px;
        right: 20px;
        background: var(--success);
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 700;
        opacity: 0;
        transition: opacity 0.4s;
        z-index: 999;
        pointer-events: none;
      }

      /* CERTIFICADO */
      .cert-toolbar {
        background: #fff;
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 1rem 1.3rem;
        margin-bottom: 1.2rem;
        display: flex;
        gap: 0.9rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }
      .cert-toolbar label {
        font-weight: 700;
        font-size: 0.95rem;
      }
      .cert-toolbar input {
        padding: 0.7rem 0.9rem;
        border: 2px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
        min-width: 240px;
        min-height: 48px;
      }
      .print-warning {
        background: var(--soft-yellow);
        color: #7a4a00;
        padding: 0.7rem 1rem;
        border-radius: 8px;

      /* ==================== ESTADO ==================== */
      function getInitialState() {
        return {
          student: {
            name: "",
            xp: 0,
            badges: [],
            completed: [],
            quizScores: {},
            answeredQs: {},
            measurements: [],
            dossier: {},
            reflections: {},
            safetyChecks: {},
            safetyOk: false,
            certificateDate: null,
          },
          view: "dashboard",
          currentModule: null,
        };
      }

      let state = loadState();
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return getInitialState();
          const s = JSON.parse(raw);
          const base = getInitialState();
          const st = Object.assign(base, s, {
            student: Object.assign(base.student, s.student || {}),
          });
          const V = ["dashboard", "map", "module", "certificate"];
          if (!V.includes(st.view)) st.view = "dashboard";
          if (
            st.view === "module" &&
            !(
              Number.isInteger(st.currentModule) &&
              st.currentModule >= 0 &&
              st.currentModule < MODULES.length
            )
          )
            st.view = "map";
          return st;
        } catch (e) {
          return getInitialState();
        }
      }
      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
        clearTimeout(window._saveT);
        window._saveT = setTimeout(flashSave, 300);
      }

      /* ==================== HELPERS ==================== */
      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const student = () => state.student;
      const displayName = () =>
        state.student.name && state.student.name.trim()
          ? state.student.name.trim()
          : "Aluno(a)";

      function levelFor(xp) {
        let lvl = LEVELS[0];
        for (const l of LEVELS) if (xp >= l.min) lvl = l;
        return lvl;
      }
      function nextLevel(xp) {
        for (const l of LEVELS) if (xp < l.min) return l;
        return null;
      }

      function flashSave() {
        let el = document.getElementById("saveIndicator");
        if (!el) {
          el = document.createElement("div");
          el.id = "saveIndicator";
          el.className = "save-indicator";
          document.body.appendChild(el);
        }
        el.textContent = "✓ Salvo";
        el.style.opacity = "1";
        clearTimeout(el._t);
        el._t = setTimeout(() => (el.style.opacity = "0"), 1800);
      }

      function showToast(msg) {
        const t = document.createElement("div");
        t.className = "toast";
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => {
          t.style.opacity = "0";
          t.style.transition = "opacity .4s";
          setTimeout(() => t.remove(), 400);
        }, 2500);
      }

      function awardXP(a) {
        state.student.xp = (state.student.xp || 0) + a;
        save();
      }
      function giveBadge(id) {
        if (!state.student.badges.includes(id)) {
          state.student.badges.push(id);
          save();
          showToast("🏅 Medalha: " + BADGES[id].name);
        }
      }

      function getRequirements(mod) {
        return [
          {
            id: "quiz",
            label: `Acerte as ${mod.quiz.length} perguntas`,
            check: (u, m) =>
              (u.answeredQs[m.id] || []).length === m.quiz.length,
          },
          ...(mod.requirements || []),
        ];
      }
      function checkRequirements(mod) {
        return getRequirements(mod).map((r) => ({
          label: r.label,
          done: r.check(state.student, mod),
        }));
      }

      function nextModuleCard(u) {
        const next = MODULES.find((m) => !u.completed.includes(m.id));
        if (!next)
          return `<div class="callout ok">🏁 Todos os módulos concluídos!</div>`;

      function renderMap() {
        const u = student();
        return `
    <div class="card">

    </div>
    <div class="grid-mod">
      ${MODULES.map((m, idx) => {

      }

      function renderModule(id) {
        const m = MODULES.find((x) => x.id === id);
        const u = student();
        if (!m) return "<p>Módulo não encontrado.</p>";
        const done = u.completed.includes(id);
        const isLast = id === MODULES.length - 1;
        return `

      <div id="quizArea"></div>

        }

  `;

      function renderQuiz(moduleId) {
        const m = MODULES.find((x) => x.id === moduleId);
        const u = student();
        const container = $("#quizArea");
        if (!container) return;

        const cumSolved = (u.answeredQs[moduleId] || []).length;

        container.innerHTML =
          m.quiz
            .map((q, i) => {
              const alreadyCorrect = (u.answeredQs[moduleId] || []).includes(i);
              return `
      <fieldset class="quiz-q" data-q="${i}">
        <legend class="qtext">${i + 1}. ${esc(q.q)}</legend>
        <div role="radiogroup">
          ${q.options
            .map((o, j) => {
              const isCorrect = j === q.correct;
              const cls = alreadyCorrect && isCorrect ? "correct" : "";
              return `<button class="quiz-opt ${cls}" data-qidx="${i}" data-oidx="${j}" ${alreadyCorrect ? 'disabled aria-disabled="true"' : ""}>${esc(o)}</button>`;
            })
            .join("")}
        </div>
        ${alreadyCorrect ? `<div class="fb ok">✓ Esta pergunta já foi respondida.</div>` : `<div class="fb" hidden></div>`}
      </fieldset>`;
            })
            .join("") +
          `
    <div class="card-soft" style="text-align:center;margin-top:.8rem">
      <strong style="font-size:1.1rem">Progresso: <span id="qProg">${cumSolved}</span>/${m.quiz.length}</strong>
    </div>`;

        container
          .querySelectorAll(".quiz-opt:not([disabled])")
          .forEach((btn) => {
            btn.onclick = () => {
              const qi = +btn.dataset.qidx,
                oi = +btn.dataset.oidx;
              const q = m.quiz[qi];
              const wrap = btn.closest(".quiz-q");
              if (wrap.dataset.solved === "1") return;

              const cur = u.quizScores[moduleId] || {
                best: cumSolved,
                total: m.quiz.length,
                attempts: 0,
              };
              cur.attempts = (cur.attempts || 0) + 1;
              cur.total = m.quiz.length;
              u.quizScores[moduleId] = cur;

              const ok = oi === q.correct;
              const fb = wrap.querySelector(".fb");
              fb.hidden = false;

              if (ok) {
                wrap.dataset.solved = "1";
                wrap.querySelectorAll(".quiz-opt").forEach((b, idx) => {
                  b.disabled = true;
                  if (idx === q.correct) b.classList.add("correct");
                });
                fb.className = "fb ok";

                const wasNew = !(u.answeredQs[moduleId] || []).includes(qi);
                u.answeredQs[moduleId] = u.answeredQs[moduleId] || [];
                if (wasNew) {
                  u.answeredQs[moduleId].push(qi);
                  awardXP(XP_PER_CORRECT);
                }
                cur.best = u.answeredQs[moduleId].length;
                u.quizScores[moduleId] = cur;

                fb.innerHTML =
                  "✓ " +
                  esc(q.feedback.correct) +
                  (wasNew
                    ? ' <span style="background:var(--accent);color:#fff;padding:.15rem .6rem;border-radius:20px;font-size:.82rem;font-weight:700;margin-left:.4rem">+' +
                      XP_PER_CORRECT +
                      " XP</span>"
                    : "");
                $("#qProg").textContent = u.answeredQs[moduleId].length;

                const BM = {
                  0: "primeiro_passo",
                  1: "leitor_atento",
                  2: "olho_tecnico",
                  3: "juiz_eletronico",
                };
                if (
                  BM[moduleId] &&
                  u.answeredQs[moduleId].length === m.quiz.length
                )
                  giveBadge(BM[moduleId]);
                save();
                updateCompletionUI(moduleId);
              } else {
                btn.disabled = true;
                btn.classList.add("wrong");
                fb.className = "fb no";
                fb.innerHTML =
                  "✗ " +
                  esc(q.feedback.wrong) +
                  ' <button class="btn sm" style="margin-left:.6rem" data-retry="' +
                  qi +
                  '">Tentar de novo</button>';
                fb.querySelector("[data-retry]").onclick = () => {
                  wrap.querySelectorAll(".quiz-opt").forEach((b) => {
                    b.disabled = false;
                    b.classList.remove("wrong", "correct");
                  });
                  fb.hidden = true;
                  fb.className = "fb";
                  fb.innerHTML = "";
                };
                save();
              }
            };
          });
      }

      function updateCompletionUI(moduleId) {
        const mod = MODULES[moduleId];
        if (!mod) return;
        const reqs = checkRequirements(mod);

          .join("")}

        }
        const btn = $("#finishMod");
        if (btn) {
          btn.disabled = !allDone;
          btn.style.opacity = allDone ? "1" : ".5";
        }

        return `

      function render() {
        const root = $("#root");
        let body = "";
        const view = state.view || "dashboard";
        switch (view) {
          case "dashboard":
            body = renderDashboard();
            break;
          case "map":
            body = renderMap();
            break;
          case "module":
            body = renderModule(state.currentModule);
            break;
          case "certificate":
            body = renderCertificate();
            break;
          default:
            body = renderDashboard();
        }
        root.innerHTML = renderHeader() + `<main class="main">${body}</main>`;
        bindGlobal();
        bindView();
        window.scrollTo(0, 0);
      }

      /* ==================== BINDINGS ==================== */
      function bindGlobal() {
        $$("[data-nav]").forEach((el) => {
          el.onclick = () => {
            const v = el.dataset.nav;
            if (v.startsWith("next-from-")) {
              const cur = +v.replace("next-from-", "");
              const next = cur + 1;
              if (next < MODULES.length) {
                state.currentModule = next;
                state.view = "module";
              } else {
                state.view = "certificate";
              }
            } else {
              state.view = v;
            }
            save();
            render();
          };
        });
        $$("[data-openmod]").forEach((el) => {
          el.onclick = () => {
            state.currentModule = +el.dataset.openmod;
            state.view = "module";
            save();
            render();
          };
        });
        const nameIn = $("#studentName");
        if (nameIn)
          nameIn.oninput = () => {
            state.student.name = nameIn.value;
            save();
          };
        const certName = $("#certName");
        if (certName)
          certName.oninput = () => {
            state.student.name = certName.value;
            save();
            const el = $("#certNameOut");
            if (el) {
              const n = displayName();
              el.textContent = n;
              el.className =
                "cert-name " +
                (n.length > 46 ? "sm" : n.length > 30 ? "md" : "");
            }
          };
        const printBtn = $("#printCert");
        if (printBtn)
          printBtn.onclick = () => {
            if (!state.student.name.trim()) {
              showToast("Coloque seu nome antes de imprimir.");
              if (certName) certName.focus();
              return;
            }
            window.print();
          };
        const resetBtn = $("#resetBtn");
        if (resetBtn)
          resetBtn.onclick = () => {
            if (!confirm("Isso apaga TUDO. Tem certeza?")) return;
            localStorage.removeItem(STORAGE_KEY);
            state = getInitialState();
            state.view = "dashboard";
            save();
            render();
            showToast("Recomeçando do zero");
          };
      }

      function bindView() {
        if (state.view === "module") {
          const fn = SETUP[state.currentModule];
          if (fn) fn();
          renderQuiz(state.currentModule);
          updateCompletionUI(state.currentModule);
          const fb = $("#finishMod");
          if (fb)
            fb.onclick = () => {
              const cur = state.currentModule;
              const u = student();
              const mod = MODULES[cur];
              const reqs = checkRequirements(mod);
              const unmet = reqs.filter((r) => !r.done);
              if (unmet.length) {
                showToast("Falta: " + unmet.map((r) => r.label).join(" · "));
                return;
              }
              if (!u.completed.includes(cur)) {
                u.completed.push(cur);
                const BM = {
                  0: "primeiro_passo",
                  1: "leitor_atento",
                  2: "olho_tecnico",
                  3: "juiz_eletronico",
                  4: "montador_cuidadoso",
                  5: "medidor_preciso",
                  6: "detetive",
                  7: "documentador",
                  8: "integrador",
                };
                if (BM[cur]) giveBadge(BM[cur]);
                awardXP(mod.xp);
                if (cur === MODULES.length - 1)
                  u.certificateDate =
                    u.certificateDate || new Date().toISOString();
                save();
              }
              const next = cur + 1;
              if (next < MODULES.length) {
                state.currentModule = next;
                state.view = "module";
              } else {
                state.view = "certificate";
              }
              save();
              render();
            };
        }
      }

      SETUP[5] = function () {
        const vd = $("#osVd"),
          td = $("#osTd"),
          cv = $("#osCanvas"),
          calc = $("#osCalc");
        if (!cv) return;
        const draw = () => {
          const Vd = parseFloat(vd.value),
            Td = parseFloat(td.value);
          $("#osVdV").textContent = Vd.toFixed(1).replace(".", ",");
          $("#osTdV").textContent = Td.toFixed(1).replace(".", ",");
          const ctx = cv.getContext("2d");
          const W = cv.width,
            H = cv.height;
          ctx.fillStyle = "#1a2530";
          ctx.fillRect(0, 0, W, H);
          ctx.strokeStyle = "#2a4055";
          for (let i = 1; i < 10; i++) {
            const x = (W / 10) * i;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.stroke();
          }
          for (let i = 1; i < 8; i++) {
            const y = (H / 8) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
          }
          const period_ms = 0.5;
          const totalTime = 10 * Td;
          const periodsVisible = totalTime / period_ms;
          const mid = H / 2;
          const amp = 2.5;
          const divsY = amp / Vd;
          const pxPerDiv = H / 8;
          const dv = Math.min(divsY, 3.9);
          const yHigh = mid - dv * pxPerDiv;
          const yLow = mid + dv * pxPerDiv;
          ctx.strokeStyle = "#F2A66A";
          ctx.lineWidth = 3;
          ctx.beginPath();
          const periodPx = W / periodsVisible;
          for (let x = 0; x < W; x++) {
            const ph = (x % periodPx) / periodPx;
            const y = ph < 0.5 ? yHigh : yLow;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          if (calc) {
            const f = 1 / (period_ms / 1000);
            calc.innerHTML = `📊 <strong>Amplitude:</strong> ~${amp} V (${(amp / Vd).toFixed(1)} divisões × ${Vd} V/div)<br>⏱️ <strong>Período:</strong> ${period_ms} ms · <strong>Frequência:</strong> ${f.toFixed(0)} Hz${divsY > 3.9 ? '<br><strong style="color:#A83232">⚠ Sinal saiu da tela. Aumente V/div.</strong>' : ""}`;
          }
        };
        vd.oninput = draw;
        td.oninput = draw;
        draw();

        const u = student();

              return;

            u.measurements.push({
              id: Date.now(),
              tp,
              val,
              unit: $("#mUnit").value,
              exp: $("#mExp").value,
            });
            ["#mTP", "#mVal", "#mExp"].forEach((s) => {
              const el = $(s);
              if (el) el.value = "";
            });
            giveBadge("medidor_preciso");
            save();
            renderMeasurements();
            updateCompletionUI(5);
          };
      };

      function renderMeasurements() {

        }
        list.innerHTML = `<table class="table"><tr><th>Onde</th><th>Valor</th><th>Esperado</th><th></th></tr>
    ${u.measurements.map((m) => `<tr><td>${esc(m.tp)}</td><td>${esc(m.val)} ${esc(m.unit)}</td><td>${esc(m.exp || "—")}</td><td><button class="btn ghost sm" data-del="${m.id}">🗑</button></td></tr>`).join("")}

        list.querySelectorAll("[data-del]").forEach((b) => {

              (m) => String(m.id) !== b.dataset.del,
